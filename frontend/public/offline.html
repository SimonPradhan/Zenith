<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>Zenith — You're offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 380px;
      }

      h1 {
        margin-bottom: 12px;
        color: #a78bfa;
      }

      p {
        color: #a1a1aa;
        line-height: 1.6;
      }

      button {
        margin-top: 12px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: #8b5cf6;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Zenith couldn't connect to the server. Reconnect to the internet
        and try again. Your account data has not been changed by this page.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
